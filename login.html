  <div class="layout-wrap">
    <main>
      <div class="page-hero">
        <h1>登录</h1>
        <p>使用账号登录后可同步收藏与评论（接入后端后生效）。</p>
      </div>
      <div class="content-section auth-panel">
        <form class="auth-form" id="loginForm" action="#" method="post" novalidate>
          <label>
            邮箱 / 用户名
            <input type="text" name="account" autocomplete="username" list="loginAccountHistory" placeholder="请输入邮箱或用户名" required />
            <datalist id="loginAccountHistory"></datalist>
          </label>
          <label>
            密码
            <input type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required />
          </label>
          <label class="auth-form__checkline">
            <input type="checkbox" name="rememberMe" />
            <span>记住密码</span>
          </label>
          <p class="auth-form__hint auth-form__hint--small">记住密码后，下次登录会自动填充账号信息。</p>
          <div class="auth-form__links">
            <a href="forgot-password.html">忘记密码？</a>
          </div>
          <button type="submit" class="btn-primary">登录</button>
        </form>
        <p class="auth-form__foot">还没有账号？<a href="register.html">前往注册</a></p>
      </div>
    </main>
