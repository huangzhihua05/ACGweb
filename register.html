  <div class="layout-wrap">
    <main>
      <div class="page-hero">
        <h1>注册</h1>
        <p>创建账号即表示您已阅读并同意站点服务条款与隐私说明。</p>
      </div>
      <div class="content-section auth-panel">
        <form class="auth-form" id="registerForm" action="#" method="post" novalidate>
          <label>
            用户名
            <input type="text" name="username" autocomplete="username" minlength="2" maxlength="32" placeholder="2–32 个字符" required />
          </label>
          <label>
            邮箱
            <input type="email" name="email" autocomplete="email" placeholder="用于登录与找回密码" required />
          </label>
          <label>
            密码
            <input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位" required />
          </label>
          <label>
            确认密码
            <input type="password" name="password2" autocomplete="new-password" placeholder="再次输入密码" required />
          </label>
          <label class="auth-form__check">
            <input type="checkbox" name="agree" required />
            我已了解本站为 ACG 公益资源分享，遵守法律法规
          </label>
          <button type="submit" class="btn-primary">注册</button>
        </form>
        <p class="auth-form__foot">已有账号？<a href="login.html">前往登录</a></p>
      </div>
    </main>
