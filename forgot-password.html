<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 - 腾游电竞工作室</title>
  <meta name="description" content="通过邮箱找回密码" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="anti-fraud-banner" role="note">
    <img src="assets/anti-fraud-banner.png" alt="反诈提示横幅" />
  </div>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo" title="腾游电竞工作室">
        <span class="logo__icon" aria-hidden="true">腾</span>
        <span>腾游ACG公益资源</span>
      </a>
      <nav class="nav-main" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="permanent.html">永久地址（建议保存）</a>
        <a href="vpn.html">VPN（自用推荐）</a>
        <a href="faq.html">解压常见问题解答</a>
        <a href="donate.html">捐赠方式（自愿）</a>
        <a href="find-game.html">代找游戏</a>
      </nav>
    </div>
  </header>

  <div class="layout-wrap">
    <main>
      <div class="page-hero">
        <h1>找回密码</h1>
        <p>通过邮箱找回密码，我们会模拟向你的邮箱发送重置指引。</p>
      </div>
      <div class="content-section auth-panel">
        <p class="auth-form__hint">以下为静态页面演示流程：发送验证码、验证身份、重置密码。</p>
        <form class="auth-form" id="forgotPasswordForm" action="#" method="post" novalidate>
          <div id="forgotPasswordStep1">
            <label>
              注册邮箱
              <input type="email" name="email" autocomplete="email" placeholder="请输入注册邮箱" required />
            </label>
            <button type="button" class="btn-primary" id="sendResetCodeBtn">发送验证码</button>
          </div>
          <div id="forgotPasswordStep2" hidden>
            <label>
              验证码
              <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" required />
            </label>
            <label>
              新密码
              <input type="password" name="newPassword" minlength="8" placeholder="请输入新密码" required />
            </label>
            <label>
              确认新密码
              <input type="password" name="newPassword2" minlength="8" placeholder="再次输入新密码" required />
            </label>
            <button type="submit" class="btn-primary">重置密码</button>
          </div>
        </form>
        <p class="auth-form__foot"><a href="login.html">返回登录</a></p>
      </div>
    </main>
  </div>

  <footer class="site-footer">© 腾游电竞工作室 · ACG 资源分享 · 仅供学习交流</footer>
  <script src="js/main.js"></script>
</body>
</html>
